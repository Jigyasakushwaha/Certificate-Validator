<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alchemist — Verification Report</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f1f5f9;
    min-height: 100vh;
    padding: 2rem 1rem;
    color: #0f172a;
}

.page { max-width: 920px; margin: 0 auto; }

.header-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 1rem;
}

.header-top {
    background: #1e1b4b;
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-name { color: #fff; font-size: 16px; font-weight: 600; }

.status-pill {
    padding: 7px 18px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
}

/* STATUS COLORS */
.stat-AUTHENTIC { background: #dcfce7; color: #166534; }
.stat-MISMATCH { background: #fef3c7; color: #92400e; }
.stat-INVALID { background: #fee2e2; color: #991b1b; }

.header-sub {
    padding: 10px 2rem;
    background: #f8fafc;
    display: flex;
    font-size: 12px;
    color: #64748b;
}

.metrics-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 1rem;
}

.metric-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 1rem;
}

.bar-wrap { height: 4px; background: #e2e8f0; margin-top: 10px; }
.bar-fill { height: 100%; }

.bg-red { background: #ef4444; }
.bg-green { background: #22c55e; }

.two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.section-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 1rem;
}

.id-display {
    font-family: monospace;
    background: #f8fafc;
    padding: 10px;
    margin-bottom: 10px;
}

.decision-list { list-style: none; }

.img-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
}

.img-card img { width: 100%; }

button {
    padding: 10px 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="page">

<!-- HEADER -->
<div class="header-card">
    <div class="header-top">
        <div class="brand">
            <div class="brand-name">Alchemist AI</div>
        </div>

        <div>
            <div id="modeText"></div>
            <span id="statusPill" class="status-pill"></span>
        </div>
    </div>

    <div class="header-sub">
        OCR Done • Forensics Done
        <span style="margin-left:auto;" id="date"></span>
    </div>
</div>

<!-- METRICS -->
<div class="metrics-row">
    <div class="metric-card">
        <div>Forgery Risk</div>
        <div id="scoreText"></div>
        <div class="bar-wrap">
            <div id="redBar" class="bar-fill bg-red"></div>
        </div>
    </div>

    <div class="metric-card">
        <div>Integrity</div>
        <div id="integrityText"></div>
        <div class="bar-wrap">
            <div id="greenBar" class="bar-fill bg-green"></div>
        </div>
    </div>
</div>

<!-- DATA -->
<div class="two-col">
    <div class="section-card">
        <div>Certificate Data</div>
        <div id="certId" class="id-display"></div>
        <div id="name"></div>
    </div>

    <div class="section-card">
        <div>Decision Points</div>
        <ul id="decisionList" class="decision-list"></ul>
    </div>
</div>

<!-- IMAGES -->
<div class="img-grid">
    <div class="img-card">
        <img id="originalImg">
    </div>
    <div class="img-card">
        <img id="forensicImg">
    </div>
</div>

</div>

<!-- JS (REPLACES JINJA) -->
<script>
const data = {
    mode: "AUTO",
    status: "AUTHENTIC",
    score: 30,
    cert_id: "CERT123456",
    name: "John Doe",
    decisions: ["✔ Data matches", "✔ QR valid", "❌ Minor mismatch"],
    original_img: "original.png",
    forensic_img: "forensic.png"
};

// SET VALUES
document.getElementById("modeText").innerText = data.mode;
document.getElementById("statusPill").innerText = data.status;
document.getElementById("statusPill").classList.add("stat-" + data.status);

document.getElementById("scoreText").innerText = data.score + "%";
document.getElementById("integrityText").innerText = (100 - data.score) + "%";

document.getElementById("redBar").style.width = data.score + "%";
document.getElementById("greenBar").style.width = (100 - data.score) + "%";

document.getElementById("certId").innerText = data.cert_id;
document.getElementById("name").innerText = data.name;

document.getElementById("date").innerText = new Date().toDateString();

// decisions
const list = document.getElementById("decisionList");
data.decisions.forEach(d => {
    const li = document.createElement("li");
    li.innerText = d;
    list.appendChild(li);
});

// images
document.getElementById("originalImg").src = data.original_img;
document.getElementById("forensicImg").src = data.forensic_img;
</script>

</body>
</html>
