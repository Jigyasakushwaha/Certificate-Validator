<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alchemist Report</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f5f7fb; padding: 40px; }
        .report-card { max-width: 900px; margin: auto; background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }
        .banner { background: #1e1b4b; color: white; padding: 20px; text-align: center; }
        .content { padding: 30px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-box { background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; }
        .img-preview { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .img-preview img { width: 100%; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="report-card">
    <div class="banner">
        <h1>{{ mode }}</h1>
        <p>Status: {{ status }}</p>
    </div>

    <div class="content">
        <div class="stat-grid">
            {% if score is defined %}
            <div class="stat-box"><strong>Tamper Score</strong><br>{{ score }}%</div>
            <div class="stat-box"><strong>Image Quality</strong><br>{{ quality }}</div>
            <div class="stat-box"><strong>Integrity</strong><br>{{ 100 - score }}%</div>
            {% endif %}
        </div>

        {% if forensic_img %}
        <div class="img-preview">
            <div><small>Original</small><br><img src="{{ url_for('static', filename=original_img) }}"></div>
            <div><small>Forensic Scan</small><br><img src="{{ url_for('static', filename=forensic_img) }}"></div>
        </div>
        {% endif %}

        {% if info %}
        <div style="background:#f1f5f9; padding:20px; border-radius:10px; margin-top:20px;">
            <strong>Analysis Details:</strong><br>{{ info }}
        </div>
        {% endif %}

        <div style="text-align:center; margin-top:30px;">
            <button onclick="window.location.href='/'" style="background:#6d28d9; color:white; border:none; padding:10px 30px; border-radius:8px; cursor:pointer;">New Scan</button>
        </div>
        <div class="stat-box"><strong>Detected ID</strong><br>{{ info }}</div>
    </div>
</div>

</body>
</html>
